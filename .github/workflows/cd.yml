name: PUBLISH NUGET

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  publish:
    runs-on: windows-latest
    env:
        PROJECT_PATH: '.\src\WPF.CornerSmoothing\WPF.CornerSmoothing.csproj'
        NUGET_SOURCE: 'https://api.nuget.org/v3/index.json'
        NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        ARTIFACTS: '.\packages'

    steps:
      # - name: Verify .NET versions
      #   run: dotnet --info

      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Set Version Variable
        if: ${{ github.ref_type == 'tag' }}
        shell: pwsh
        run: |
          $version = '${{ env.TAG }}' -replace '^v', ''
          echo "VERSION=$version" >> $env:GITHUB_ENV
        env:
          TAG: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
      
      - name: Pack & Push
        run: |
            dotnet pack ${{ env.PROJECT_PATH }} -c Release -o ${{ env.ARTIFACTS }} --property:Version=${{ env.VERSION }}
            dotnet nuget push ${{ env.ARTIFACTS }}\WPF.CornerSmoothing.${{ env.VERSION }}.nupkg --api-key ${{ env.NUGET_API_KEY }} --source ${{ env.NUGET_SOURCE }}
      # - name: Check Version
      #   shell: pwsh
